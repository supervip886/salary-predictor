<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #4F46E5; --primary-light: #818CF8; --primary-dark: #3730A3;
  --success: #10B981; --danger: #EF4444; --bg: #F8FAFC; --card-bg: #FFFFFF;
  --text: #1E293B; --text-secondary: #64748B; --text-light: #94A3B8; --border: #E2E8F0;
  --shadow: 0 1px 3px rgba(0,0,0,0.06); --radius: 9px; --radius-lg: 13px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }

.hero { text-align: center; padding: 42px 20px 30px; background: var(--card-bg); border-bottom: 1px solid var(--border); }
.hero h1 { font-size: 25px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 3px; }
.hero p { font-size: 14px; color: var(--text-secondary); }

.container { max-width: 840px; margin: 26px auto 60px; padding: 0 20px; }

.step-indicator { display: flex; justify-content: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
.step-dot { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--text-light); font-weight: 500; cursor: pointer; min-width: 44px; }
.step-dot .dot-circle { width: 24px; height: 24px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--text-secondary); transition: all 0.25s; }
.step-dot.active .dot-circle { background: var(--primary); color: white; }
.step-dot.active { color: var(--primary); }
.step-dot.done .dot-circle { background: var(--success); color: white; }
.step-dot.done { color: var(--success); }

.card { background: var(--card-bg); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 28px 24px; }
.card-header { margin-bottom: 20px; }
.card-header h2 { font-size: 18px; font-weight: 700; }
.card-header .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.option-card { display: flex; align-items: center; gap: 8px; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all 0.15s; font-size: 13px; font-weight: 500; background: var(--card-bg); }
.option-card:hover { border-color: var(--primary-light); background: #F8F7FF; }
.option-card.selected { border-color: var(--primary); background: #EEF2FF; }
.option-card .radio { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; }
.option-card.selected .radio { border-color: var(--primary); background: var(--primary); }
.option-card.selected .radio::after { content: ''; display: block; width: 5px; height: 5px; background: white; border-radius: 50%; margin: 3px; }

/* Stage block for degree-step school+major */
.stage-block { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 16px 12px; margin-bottom: 14px; }
.stage-block:last-child { margin-bottom: 0; }
.stage-label { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.stage-label::before { content: ''; width: 4px; height: 16px; background: var(--primary); border-radius: 2px; display: inline-block; }
.stage-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 600px) { .stage-row { grid-template-columns: 1fr; } }
.stage-col h4 { font-size: 11px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.stage-col .form-grid { grid-template-columns: 1fr; }

.btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 24px; }
.btn { padding: 10px 28px; border-radius: 8px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled { background: #C7D2FE; cursor: not-allowed; }
.btn-back { background: transparent; color: var(--text-secondary); border: 1.5px solid var(--border); }
.btn-back:hover { border-color: var(--text-secondary); color: var(--text); }

.progress-wrap { margin-bottom: 16px; }
.progress-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width 0.4s ease; }

#result-section { display: none; }
.result-hero { text-align: center; padding: 30px 20px; background: #FAFBFF; border: 1px solid #E8ECF4; border-radius: var(--radius-lg); margin-bottom: 16px; }
.result-hero .salary-label { font-size: 13px; color: var(--text-secondary); }
.result-hero .salary-number { font-size: 50px; font-weight: 900; color: var(--primary); letter-spacing: -2px; line-height: 1.15; }
.result-hero .salary-number .unit { font-size: 19px; font-weight: 600; }
.result-hero .salary-range { font-size: 13px; color: var(--text-secondary); margin-top: 5px; }
.result-hero .salary-range .range-val { font-weight: 600; color: var(--text); }
.result-hero .monthly-hint { font-size: 12px; color: var(--text-light); margin-top: 5px; }

.result-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 16px; }
.result-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px; text-align: center; }
.result-card .card-icon { font-size: 18px; margin-bottom: 2px; }
.result-card .card-title { font-size: 11px; color: var(--text-light); }
.result-card .card-value { font-size: 14px; font-weight: 700; margin-top: 1px; }

.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
@media (max-width: 650px) { .charts-row { grid-template-columns: 1fr; } }
.chart-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.chart-wrap { position: relative; height: 220px; display: flex; align-items: center; justify-content: center; }

.factor-list { margin-top: 10px; }
.factor-item { display: flex; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); }
.factor-item:last-child { border-bottom: none; }
.factor-item .factor-name { width: 80px; font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
.factor-item .factor-bar-wrap { flex: 1; height: 5px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 0 8px; }
.factor-item .factor-bar { height: 100%; border-radius: 2px; transition: width 0.8s ease; }
.factor-item .factor-impact { font-size: 11px; font-weight: 600; white-space: nowrap; }
.factor-item .impact-up { color: var(--success); }
.factor-item .impact-down { color: var(--danger); }
.factor-item .impact-neutral { color: var(--text-light); }

.restart-wrap { text-align: center; margin-top: 22px; }
.footer { text-align: center; padding: 20px; color: var(--text-light); font-size: 12px; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: white; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
.toast.show { opacity: 1; }
.fade-in { animation: fadeIn 0.4s ease; }

/* ---- Admin Dashboard ---- */
#admin-panel { display: none; max-width: 900px; margin: 20px auto; }
#admin-panel .admin-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px; margin-bottom: 16px; box-shadow: var(--shadow); }
.admin-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.admin-cards .ac { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; text-align: center; }
.ac .ac-num { font-size: 32px; font-weight: 900; color: var(--primary); line-height: 1.1; }
.ac .ac-label { font-size: 12px; color: var(--text-light); margin-top: 4px; }
.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.admin-table th, .admin-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; }
.admin-table th { color: var(--text-light); font-weight: 600; font-size: 11px; text-transform: uppercase; }
.admin-bar-wrap { height: 20px; background: var(--border); border-radius: 4px; overflow: hidden; min-width: 100px; }
.admin-bar { height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.5s; }
.admin-reset { text-align: right; margin-top: 16px; }
.admin-reset button { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@media print { .hero { border-bottom: 1px solid #ddd; } .btn-row, .restart-wrap, .step-indicator, .progress-wrap { display: none; } .card { box-shadow: none; border: 1px solid #ddd; } }
</style>

function singleMajorMatch(position, major) {
  const table = majorMatchTable[position];
  if (!table) return matchGrades.unrelated;
  if (table.core && table.core.includes(major)) return matchGrades.core;
  if (table.semi && table.semi.includes(major)) return matchGrades.semi;
  if (table.related && table.related.includes(major)) return matchGrades.related;
  return matchGrades.unrelated;
}

function combinedMajorMatch(position, edu, ug, ms, ph) {
  if (edu === '本科') return singleMajorMatch(position, ug);
  if (edu === '硕士') {
    const a = singleMajorMatch(position, ms);
    const b = singleMajorMatch(position, ug);
    return {
      label: a.label + (b.label === '科班' || b.label === '半科班' ? '（本+硕）' : ''),
      bonus: +(a.bonus * 0.7 + b.bonus * 0.3).toFixed(3)
    };
  }
  const p = singleMajorMatch(position, ph);
  const m = singleMajorMatch(position, ms);
  const u = singleMajorMatch(position, ug);
  const hasGood = (m.label === '科班' || m.label === '半科班' || u.label === '科班' || u.label === '半科班');
  return {
    label: p.label + (hasGood ? '（多阶段相关）' : ''),
    bonus: +(p.bonus * 0.6 + m.bonus * 0.25 + u.bonus * 0.15).toFixed(3)
  };
}

function combinedSchoolMul(edu, ugS, msS, phS) {
  const u = schoolTierMul[ugS] || 1;
  if (edu === '本科') return u;
  const m = schoolTierMul[msS] || 1;
  if (edu === '硕士') return +(m * 0.7 + u * 0.3).toFixed(3);
  const p = schoolTierMul[phS] || 1;
  return +(p * 0.6 + m * 0.25 + u * 0.15).toFixed(3);
}

  const grid = document.getElementById(containerId);

    div.className = 'option-card' + (selectedVal === opt.value ? ' selected' : '');

    div.addEventListener('click', () => { selections[key] = opt.value; renderStep(); });

  });

function nextStep() {
  if (currentStep < 7) { currentStep++; renderStep();
    document.getElementById('form-card').classList.remove('fade-in');
    void document.getElementById('form-card').offsetWidth;
    document.getElementById('form-card').classList.add('fade-in');
  } else { calculate(); }
}
function prevStep() { if (currentStep > 0) { currentStep--; renderStep(); } }

function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timeout); t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
}

// ====== ELIGIBILITY CHECK ======
function checkEligibility(edu, schoolComposite, paper, comp, ic, inc, position, company, matchLabel, industry) {
  const reasons = [];
  const isTop = (company === '头部大厂');
  const isMidTop = (company === '头部大厂' || company === '中大型企业');
  const isForeign = (company === '外企');
  const isGoodCompany = isMidTop || isForeign;

  // --- AI大模型算法 (highest bar) ---
  if (position === 'AI大模型/具身智能算法') {
    if (isTop) {
      if (edu === '本科') reasons.push('大模型算法岗·头部大厂要求硕士及以上学历');
      if (schoolComposite < 1.0) reasons.push('大模型算法岗·头部大厂要求 211/双一流及以上学校');
      if (paper !== '核心期刊/顶会') reasons.push('大模型算法岗·头部大厂要求顶会/核心期刊论文（人均 5-6 篇为基线）');
      if (comp === '无' || comp === '区域赛获奖') reasons.push('大模型算法岗·头部大厂要求 ACM 银牌/全国赛及以上竞赛经历');
      if (ic !== '头部企业/大厂') reasons.push('大模型算法岗·头部大厂要求至少 1 段大厂对口实习');
      if (matchLabel === '完全无关') reasons.push('大模型算法岗要求科班或半科班专业背景');
    } else if (isMidTop) {
      if (edu === '本科') reasons.push('大模型算法岗要求硕士及以上学历');
      if (schoolComposite < 0.95) reasons.push('大模型算法岗要求双一流及以上学校');
      if (paper === '无') reasons.push('大模型算法岗要求至少普通期刊论文');
    } else {
      if (paper === '无') reasons.push('大模型算法岗要求至少有一定研究成果');
    }
  }

  // --- 普通算法 ---
  else if (position === '普通算法（搜索/推荐/广告等）') {
    if (isTop) {
      if (edu === '本科') reasons.push('头部大厂算法岗通常要求硕士及以上学历');
      if (schoolComposite < 1.0) reasons.push('头部大厂算法岗要求 211/双一流及以上学校');
      if (matchLabel === '完全无关') reasons.push('头部大厂算法岗要求科班或半科班专业背景');
    } else if (isMidTop) {
      if (schoolComposite < 0.89) reasons.push('中大型企业算法岗要求双非一本及以上学校');
    }
  }

  // --- 技术研发 ---
  else if (position === '技术研发（前后端/全栈）') {
    if (isTop) {
      if (schoolComposite < 0.82) reasons.push('头部大厂研发岗要求一本及以上学校');
      if (ic === '无实习经历') reasons.push('头部大厂研发岗要求至少 1 段实习经历');
    }
  }

  // --- 数据分析 ---
  else if (position === '数据分析/数据科学') {
    if (isTop) {
      if (schoolComposite < 0.89) reasons.push('头部大厂数据分析岗要求双非一本及以上学校');
      if (matchLabel === '完全无关') reasons.push('头部大厂数据分析岗要求理工/金融/商科相关专业');
    }
  }

  // --- 产品经理 ---
  else if (position === '产品经理') {
    if (isTop) {
      if (schoolComposite < 0.82) reasons.push('头部大厂产品岗要求一本及以上学校');
    }
  }

  // --- 咨询 ---
  else if (industry === '咨询') {
    if (isGoodCompany) {
      if (schoolComposite < 1.0) reasons.push('咨询行业（头部/外企）要求 211 及以上学校');
      if (edu !== '硕士' && edu !== '博士') reasons.push('咨询行业（头部/外企）通常要求硕士及以上学历');
      if (ic === '无实习经历') reasons.push('咨询行业要求至少 1 段实习经历');
    }
  }

  // --- 金融 ---
  else if (industry === '金融') {
    if (isGoodCompany) {
      if (schoolComposite < 0.95) reasons.push('金融行业（头部/外企）要求双一流及以上学校');
      if (edu === '本科' && position !== '技术研发（前后端/全栈）') reasons.push('金融行业核心岗位通常要求硕士及以上学历');
    }
  }

  // --- 法务 ---
  else if (position === '法务/合规') {
    if (isTop) {
      if (matchLabel === '完全无关') reasons.push('法务岗要求法学专业背景');
      if (schoolComposite < 0.89) reasons.push('头部大厂法务岗要求双非一本及以上学校');
    }
  }

  // --- 财务/审计 ---
  else if (position === '财务/会计/审计') {
    if (isTop) {
      if (matchLabel === '完全无关') reasons.push('头部大厂财务岗要求财会/金融/经济相关专业');
    }
  }

  // --- 半导体/芯片 (industry check) ---
  if (industry === '半导体/芯片' && isGoodCompany) {
    if (position === '行政/后勤' || position === '客户服务' || position === '人力资源') {
      // Non-tech positions in semiconductor are OK, lower bar
    } else {
      if (matchLabel === '完全无关' && position !== '销售/商务拓展' && position !== '市场营销/品牌') {
        reasons.push('半导体/芯片行业技术岗要求理工科相关专业');
      }
    }
  }

  return { eligible: reasons.length === 0, reasons };
}

// ====== CALCULATE ======
function calculate() {
  const edu = selections.education;
  const ugS = selections.ug_school, msS = selections.mas_school, phS = selections.phd_school;
  const ugM = selections.ug_major, msM = selections.mas_major, phM = selections.phd_major;
  const city = selections.city, industry = selections.industry, position = selections.position;
  const ic = selections.internCompany, inc = selections.internCount;
  const company = selections.company || '中小企业';
  const paper = selections.paper || '无', comp = selections.competition || '无';

  const base = cityBase[city] || 10000;
  const eduMul = eduMultiplier[edu] || 1;
  const schoolMul = combinedSchoolMul(edu, ugS, msS, phS);
  // Over-qualification dampening: PhD premium shrinks on irrelevant positions
  const effEdu = 1 + (eduMul - 1) * (cfg.edu || 1);
  const effSchool = 1 + (schoolMul - 1) * (cfg.sch || 1);
  const indMul = industryMul[industry] || 1;
  const comMul = companyMul[company] || 1;
  const cfg = positionConfig[position] || { base:1.0, w:{paper:0,competition:0,internship:0.3,major:0.3} };
  const posBase = cfg.base;
  const match = combinedMajorMatch(position, edu, ugM, msM, phM);
  const iVal = getInternshipValue(ic, inc);
  const pRaw = paperRaw[paper] || 1, cRaw = competitionRaw[comp] || 1;

  // Weighted factors: 1 + weight × (raw - 1)
  const pFac = wf(cfg.w.paper, pRaw);
  const cFac = wf(cfg.w.competition, cRaw);
  const iFac = wf(cfg.w.internship, iVal);
  const mFac = wf(cfg.w.major, match.bonus);

  const monthly = Math.round(base * effEdu * effSchool * indMul * comMul * posBase * pFac * cFac * iFac * mFac);
  let months = industryMonths[industry] || 12;
  // 国企/央企的金融行业薪制偏低（银行 vs 券商差异）
  if (industry === '金融' && (company === '国企/央企')) months = 13;
  const annual = Math.round(monthly * months);
  const lo = Math.round(annual * 0.85), hi = Math.round(annual * 1.22);

  // Eligibility check — fail fast if below minimum bar
  const eligibility = checkEligibility(edu, schoolMul, paper, comp, ic, inc, position, company, match.label, industry);

  document.getElementById('form-section').style.display = 'none';
  document.getElementById('result-section').style.display = 'block';
  document.querySelector('.step-indicator').style.display = 'none';
  document.querySelector('.progress-wrap').style.display = 'none';

  if (!eligibility.eligible) {
    // Show ineligible warning
    const fmt = n => n >= 10000 ? (n / 10000).toFixed(n % 10000 === 0 ? 0 : 1) + ' 万' : n.toLocaleString();
    document.getElementById('result-hero').innerHTML = '<div class="salary-label">⚠️ 当前条件难以进入该岗位</div><div class="salary-number" style="font-size:22px;font-weight:700;color:var(--danger)">条件不达标</div><div class="salary-range" style="color:var(--text-secondary)">以下条件未能满足该岗位的准入门槛：</div>';
    document.getElementById('result-cards').innerHTML = '';
    document.getElementById('factor-list').innerHTML = eligibility.reasons.map(r => '<div class="factor-item"><span class="factor-impact impact-down" style="width:100%">✗ ' + r + '</span></div>').join('');
    document.querySelector('.charts-row').style.display = 'none';
    document.querySelectorAll('.chart-card')[2] && (document.querySelectorAll('.chart-card')[2].style.display = 'none');
    return;
  }
  // Normal result below
  document.querySelector('.charts-row').style.display = 'grid';
  document.querySelectorAll('.chart-card')[2] && (document.querySelectorAll('.chart-card')[2].style.display = 'block');

  // Track prediction
  trackPredict(annual, city, industry, position, edu);

  const fmt = n => n >= 10000 ? (n / 10000).toFixed(n % 10000 === 0 ? 0 : 1) + ' 万' : n.toLocaleString();
  document.getElementById('result-hero').innerHTML = `
    <div class="salary-label">预测年薪（税前）</div>
    <div class="salary-number"><span class="unit">¥</span>${fmt(annual)}</div>
    <div class="salary-range">参考区间 <span class="range-val">¥${fmt(lo)}</span> — <span class="range-val">¥${fmt(hi)}</span></div>
    <div class="monthly-hint">≈ 月薪 ¥${(monthly / 1000).toFixed(1)}K（按 ${months} 薪折算年包）</div>`;

  // Build school tier display string
  let schoolStr = edu + ' · ' + (schoolTierOptions.find(o=>o.value===ugS)||{}).label||ugS||'';
  if (edu==='硕士'||edu==='博士') schoolStr += ' → ' + ((schoolTierOptions.find(o=>o.value===msS)||{}).label||msS||'');
  if (edu==='博士') schoolStr += ' → ' + ((schoolTierOptions.find(o=>o.value===phS)||{}).label||phS||'');

  document.getElementById('result-cards').innerHTML = `
    <div class="result-card"><div class="card-icon">📅</div><div class="card-title">估算月薪</div><div class="card-value">¥${(monthly/1000).toFixed(1)}K</div></div>
    <div class="result-card"><div class="card-icon">💼</div><div class="card-title">薪制</div><div class="card-value">${months} 薪</div></div>
    <div class="result-card"><div class="card-icon">🎓</div><div class="card-title">学历学校</div><div class="card-value" style="font-size:12px">${schoolStr}</div></div>
    <div class="result-card"><div class="card-icon">🔗</div><div class="card-title">专业匹配</div><div class="card-value">${match.label}</div></div>`;

  const factors = [
    { name:'城市基准',   val:base/1000,     impact:'base',    desc:city },
    { name:'学历层次',   val:effEdu,        impact:effEdu>=1?'up':'down', desc:edu+(cfg.edu<1?'（×'+Math.round(cfg.edu*100)+'%相关）':'') },
    { name:'学校档次',   val:effSchool,     impact:effSchool>=1?'up':'down', desc:schoolStr+(cfg.sch<1?'（×'+Math.round(cfg.sch*100)+'%相关）':'') },
    { name:'行业(系数)', val:indMul,        impact:indMul>=1?'up':'down', desc:industry },
    { name:'行业(薪制)', val:months/12,     impact:months>12?'up':months<12?'down':'neutral', desc:months+'薪' },
    { name:'公司类型',   val:comMul,        impact:comMul>=1?'up':'down', desc:company },
    { name:'岗位基准',   val:posBase,       impact:posBase>=1?'up':'down', desc:position },
    { name:'专业匹配',   val:mFac,          impact:mFac>=1?'up':'down', desc:match.label },
    { name:'实习(综合)', val:iFac,          impact:iFac>=1?'up':'down', desc:ic+'·'+inc },
    { name:'论文',       val:pFac,          impact:pFac>1?'up':pFac<1?'down':'neutral', desc:paper+' (权重'+Math.round(cfg.w.paper*100)+'%)' },
    { name:'竞赛',       val:cFac,          impact:cFac>1?'up':cFac<1?'down':'neutral', desc:comp+' (权重'+Math.round(cfg.w.competition*100)+'%)' }
  ];

  const maxV = Math.max(...factors.map(f=>f.val));
  document.getElementById('factor-list').innerHTML = factors.map(f=>{
    const pct = (f.val/maxV)*100;
    const color = f.impact==='up'?'var(--success)':f.impact==='down'?'var(--danger)':'var(--primary)';
    const icon = f.impact==='up'?'↑':f.impact==='down'?'↓':'·';
    const cls = f.impact==='up'?'impact-up':f.impact==='down'?'impact-down':'impact-neutral';
    return `<div class="factor-item"><span class="factor-name">${f.name}</span><div class="factor-bar-wrap"><div class="factor-bar" style="width:${pct}%;background:${color}"></div></div><span class="factor-impact ${cls}">${icon} ${f.desc}</span></div>`;
  }).join('');

  setTimeout(()=>drawCharts(factors.filter(f=>f.impact!=='base'),annual,position,city,edu),200);
}

function drawCharts(fc, annual, position, city, edu) {
  if (charts.d) charts.d.destroy(); if (charts.b) charts.b.destroy();
  const td = fc.reduce((s,f)=>s+Math.abs(Math.log2(f.val)),0);
  const cols = ['#4F46E5','#7C3AED','#EC4899','#F59E0B','#10B981','#3B82F6','#EF4444','#8B5CF6','#06B6D4'];
  charts.d = new Chart(document.getElementById('doughnut-chart').getContext('2d'),{type:'doughnut',
    data:{labels:fc.map(f=>f.name),datasets:[{data:fc.map(f=>+(Math.abs(Math.log2(f.val))/td*100).toFixed(1)),backgroundColor:cols.slice(0,fc.length),borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{padding:10,usePointStyle:true,pointStyleWidth:6,font:{size:11}}}}}
  });
  // Bar chart: real market benchmarks (not relative to prediction)
  const [bp25, bp50, bp75] = getMarketBenchmarks(position, city, edu);
  charts.b = new Chart(document.getElementById('bar-chart').getContext('2d'),{type:'bar',
    data:{labels:['市场 P25','市场 P50\n(中位数)','你的预测值','市场 P75'],
      datasets:[{data:[bp25, bp50, +(annual/1e4).toFixed(1), bp75],backgroundColor:['#C7D2FE','#818CF8','#4F46E5','#6366F1'],borderRadius:5,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`¥${ctx.raw}万/年`}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>v+'万'}}}}
  });
}

function restart() {
  currentStep=0; selections={paper:'无',competition:'无'};
  document.getElementById('form-section').style.display='block';
  document.getElementById('result-section').style.display='none';
  document.querySelector('.step-indicator').style.display='flex';
  document.querySelector('.progress-wrap').style.display='block';
  document.querySelector('.charts-row').style.display='grid';
  if(charts.d){charts.d.destroy();charts.d=null;} if(charts.b){charts.b.destroy();charts.b=null;}
  renderStep();
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('form-section').style.display!=='none'){e.preventDefault();e.shiftKey?prevStep():nextStep();}
});
document.getElementById('btn-next').addEventListener('click',nextStep);
document.getElementById('btn-prev').addEventListener('click',prevStep);

// ====== ANALYTICS ======
function loadStats(){ try{ return JSON.parse(localStorage.getItem('salary_stats')||'{"visits":0,"predictions":[],"cities":{},"industries":{},"positions":{},"edus":{}}'); }catch(e){ return {visits:0,predictions:[],cities:{},industries:{},positions:{},edus:{}}; } }
function saveStats(s){ localStorage.setItem('salary_stats',JSON.stringify(s)); }
function trackVisit(){ const s=loadStats(); s.visits++; const d=new Date(); s.lastVisit=d.toISOString(); saveStats(s); }
function trackPredict(salary,city,industry,position,edu){ const s=loadStats(); s.predictions.unshift({time:new Date().toLocaleString(),salary,city,industry,position,edu,eligible:true}); if(s.predictions.length>20)s.predictions=s.predictions.slice(0,20); s.cities[city]=(s.cities[city]||0)+1; s.industries[industry]=(s.industries[industry]||0)+1; s.positions[position]=(s.positions[position]||0)+1; s.edus[edu]=(s.edus[edu]||0)+1; saveStats(s); }
function resetStats(){ if(confirm('确定清除所有统计数据？')){ localStorage.removeItem('salary_stats'); hideAdmin(); } }

function top5(obj){ return Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,5); }
function bar(val,max){ const pct=max>0?Math.round(val/max*100):0; return '<div class="admin-bar-wrap"><div class="admin-bar" style="width:'+pct+'%"></div></div>'; }

function renderAdmin(){
  const s=loadStats();
  const totalPred=s.predictions.length;
  const avgSal=totalPred>0?Math.round(s.predictions.reduce((a,p)=>a+p.salary,0)/totalPred):0;
  const fmt=n=>n>=10000?(n/10000).toFixed(1)+'万':n;
  document.getElementById('admin-cards').innerHTML=
    '<div class="ac"><div class="ac-num">'+s.visits+'</div><div class="ac-label">页面访问</div></div>'+
    '<div class="ac"><div class="ac-num">'+totalPred+'</div><div class="ac-label">预测次数</div></div>'+
    '<div class="ac"><div class="ac-num">¥'+fmt(avgSal)+'</div><div class="ac-label">平均预测年包</div></div>'+
    '<div class="ac"><div class="ac-num">'+new Date(s.lastVisit||Date.now()).toLocaleDateString()+'</div><div class="ac-label">最近访问</div></div>';

  const top=[{label:'城市',data:top5(s.cities)},{label:'行业',data:top5(s.industries)},{label:'岗位',data:top5(s.positions)},{label:'学历',data:top5(s.edus)}];
  const maxTop=Math.max(...top.flatMap(t=>t.data.map(d=>d[1])),1);
  document.getElementById('admin-top').innerHTML=top.map(t=>{
    const rows=t.data.map(([k,v])=>'<tr><td>'+t.label+'</td><td>'+k+'</td><td>'+v+'次</td><td>'+bar(v,maxTop)+'</td></tr>').join('');
    return rows;
  }).join('');

  document.getElementById('admin-recent').innerHTML=totalPred>0?
    '<table class="admin-table"><tr><th>时间</th><th>年包</th><th>城市</th><th>行业</th><th>岗位</th></tr>'+
    s.predictions.slice(0,8).map(p=>'<tr><td>'+p.time+'</td><td>¥'+fmt(p.salary)+'</td><td>'+p.city+'</td><td>'+p.industry+'</td><td>'+p.position+'</td></tr>').join('')+'</table>'
    :'<p style="color:var(--text-light);font-size:13px">暂无预测记录</p>';
}

function showAdmin(){ document.getElementById('form-section').style.display='none'; document.getElementById('result-section').style.display='none'; document.querySelector('.step-indicator').style.display='none'; document.querySelector('.progress-wrap').style.display='none'; document.querySelector('.hero').style.display='none'; document.getElementById('admin-panel').style.display='block'; renderAdmin(); }
function hideAdmin(){ document.getElementById('admin-panel').style.display='none'; document.querySelector('.hero').style.display='block'; document.getElementById('form-section').style.display='block'; document.querySelector('.step-indicator').style.display='flex'; document.querySelector('.progress-wrap').style.display='block'; restart(); }

// Auto-track visit on load
trackVisit();
// Auto-show admin if ?admin in URL
if(location.search.includes('admin'))showAdmin();

renderStep();
</script>
